name: Independent planetary replay
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: read
  issues: write
jobs:
  verify:
    if: startsWith(github.event.issue.body, 'fuel-lab-replay-v1 ') || contains(github.event.issue.labels.*.name, '[PEER-REPRODUCED]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Read the published qualification snapshot
        run: |
          git fetch --quiet --no-tags origin refs/heads/lab-data
          git show FETCH_HEAD:data/stage4.json > "$RUNNER_TEMP/planetary-index.json"
      - name: Replay the receipt and award a matching qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.peer_verify --checkpoint "$RUNNER_TEMP/planetary-index.json"
