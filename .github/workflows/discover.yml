name: Liquid fuel discovery
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: liquid-fuel-discovery
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Verify scientific invariants
        run: |
          python3 -m unittest discover -s tests -p 'test_physics.py' -v
          python3 -m unittest discover -s tests -p 'test_stage2_survival.py' -v
          python3 -m unittest discover -s tests -p 'test_stage3_calibration.py' -v
          python3 -m unittest discover -s tests -p 'test_stage4_planetary.py' -v
      - name: Collect independent numerical receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.peer_verify --collect "$RUNNER_TEMP/receipts.json"
      - name: Evaluate and publish the next generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: FUEL_LAB_PEER_CLAIMS="$RUNNER_TEMP/receipts.json" bash scripts/publish.sh
